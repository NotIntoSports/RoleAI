[package]
name = "role-ai-desktop"
version = "0.1.0"
description = "本地优先的 Windows 实时语音 AI 角色助手：Rust + Tauri 全双工语音管线，支持面试官角色语音对练、会议助手与直播讲解"
authors = ["RoleAI contributors"]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[lib]
name = "ai_virtual_assistant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "role-ai-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
docx-rs = { version = "=0.4.22", default-features = false }
obws = { version = "=0.15.0", default-features = false }
pdf-extract = "=0.12.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
sqlite-vec = "=0.1.9"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
# rustls 本体是 reqwest/tungstenite/tauri-plugin-updater 的共同传递依赖：updater 启用
# `ring`、reqwest 的 rustls feature 启用 `aws-lc-rs`，两者并存时 rustls 拒绝自动选择
# CryptoProvider，实时会话 WS 握手线程会 panic。直接依赖仅为在进程启动处显式
# install_default()，与 reqwest 一致选 aws-lc-rs；不改变依赖树（crate 已被编译）。
rustls = { version = "=0.23.45", default-features = false, features = ["std", "aws-lc-rs"] }
serde = { version = "=1.0.229", features = ["derive"] }
base64 = "=0.23.1"
sha2 = "=0.10.9"
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", default-features = false, features = ["common-controls-v6", "compression", "wry"] }
tauri-plugin-single-instance = "=2.4.4"
# 应用内手动检查更新（G07）：官方插件，更新源指向 GitHub Release 的 latest.json；
# 无签名公钥时前端显示「未配置更新源」，不影响启动。
# 2.12+ 要求 tauri ^2.12（项目钉 tauri =2.11.5），故停在兼容线上 2.11.0。
tauri-plugin-updater = "=2.11.0"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
ts-rs = { version = "=12.0.1", features = ["chrono-impl", "serde-json-impl", "uuid-impl"] }
uuid = { version = "=1.26.0", features = ["serde", "v4"] }
zeroize = "=1.9.0"
# ort 必须保持 Cargo.lock 钉住的 2.0.0-rc.10：该 crate 声明 ort = "2.0.0-rc.10"（开放范围），
# 但 rc.11+ 移除了 CPUExecutionProvider，升级 ort 会导致编译失败。
# default-features = false 关闭 ort-load-dynamic：改为构建期静态链接 onnxruntime 1.22，
# 避免运行时误加载本机 System32 的旧版 onnxruntime.dll；hound(WAV) 未使用。
silero-vad-rust = { version = "=6.2.2", default-features = false }
# Smart Turn 语义断句（阶段 3）：直接依赖与 silero 同一钉版的 ort 跑 ONNX。
# 默认特性不含 load-dynamic，复用阶段 1 的静态链接 onnxruntime，不引入第二个 ort 版本。
ort = "=2.0.0-rc.10"
# Whisper 对数梅尔特征的 FFT（MIT/Apache-2.0）；梅尔滤波器组与归一化自实现，
# 精确对齐 HF transformers WhisperFeatureExtractor（现有 mel_spec crate 是 kaldi 约定，不匹配）。
rustfft = "=6.4.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "=3.27.0"
criterion = "=0.8.2"
proptest = "=1.11.0"
tauri = { version = "=2.11.5", default-features = false, features = ["test"] }

[[bench]]
name = "audio_hotpath"
path = "benches/audio_hotpath.rs"
harness = false

[[bench]]
name = "materials"
path = "benches/materials.rs"
harness = false
