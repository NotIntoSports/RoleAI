name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述你现在的做法和遇到的不便，而不是直接给方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 适用范围确认
      options:
        - label: 我确认这是桌面应用本身的问题/需求，与特定模型服务商的账号、套餐或配额无关
          required: true
