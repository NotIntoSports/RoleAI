# GitHub Pages：落地页（website/）+ 在线演示（dist-demo）。
# 发布由用户在仓库 Settings → Pages → Source 选 “GitHub Actions” 后生效；本工作流只在 main 更新时运行。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build demo (base=/RoleAI/demo/)
        run: npm run build:demo
        env:
          DEMO_BASE: /RoleAI/demo/
      - name: Assemble site
        run: |
          mkdir -p site/assets/screenshots site/demo
          cp -r website/. site/
          cp -r .github/assets/screenshots/. site/assets/screenshots/
          cp -r dist-demo/. site/demo/
          # dist-demo 的入口是 demo.html（base=/RoleAI/demo/），Pages 目录访问需要 index.html。
          cp dist-demo/demo.html site/demo/index.html
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
