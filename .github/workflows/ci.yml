name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 分支（2026-09-30）
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - run: npm ci
      - name: Reject local-only docs and agent ledgers
        shell: pwsh
        run: |
          $blocked = @(
            git ls-files '.superpowers' 'docs'
          ) | Where-Object { $_ }
          if ($blocked.Count -gt 0) {
            Write-Error ("These paths must stay out of the repo:`n" + ($blocked -join "`n"))
            exit 1
          }
      - run: npm audit --audit-level=high
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - run: npx tsc -p tsconfig.tauri.json --noEmit
      - run: npm run test:tauri-ui
      - run: node --test tests/tauri/*.test.mjs
      - run: npm run test:tauri

  portable:
    # 跨平台可移植性证明：Linux / macOS 上 cargo check + lib 单测通过。
    # Windows 专属能力（凭据管理器、AudioBridge sidecar、会议进程采集）已在
    # src-tauri/src 内以 cfg 门控：非 Windows 运行时返回 PLATFORM_UNSUPPORTED
    # 或回退内存密钥库，依赖 Windows 的测试本身用 #[cfg(windows)] 标注（不是 ignore）。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 分支（2026-09-30）
        with:
          toolchain: '1.96'
      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        # Tauri v2 官方前置依赖（https://v2.tauri.app/start/prerequisites/）：
        # webkit2gtk-4.1（Linux WebView 渲染）、libxdo、libayatana-appindicator3（托盘）、
        # librsvg2、openssl；build-essential 提供 C 工具链（rusqlite bundled / ort 链接需要）。
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: cargo check --all-targets
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: cargo test --lib
        working-directory: src-tauri
        run: cargo test --lib

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # 供应链检查：许可证、RustSec 漏洞公告、重复依赖、来源白名单（src-tauri/deny.toml）。
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2 移动标签（v2.1.1 之后，2026-09-30）
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check
