name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - run: npm ci
      - name: Reject local-only docs and agent ledgers
        shell: pwsh
        run: |
          $blocked = @(
            git ls-files '.superpowers' 'docs'
          ) | Where-Object { $_ }
          if ($blocked.Count -gt 0) {
            Write-Error ("These paths must stay out of the repo:`n" + ($blocked -join "`n"))
            exit 1
          }
      - run: npm audit --audit-level=high
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - run: npx tsc -p tsconfig.tauri.json --noEmit
      - run: npm run test:tauri-ui
      - run: node --test tests/tauri/*.test.mjs
      - run: npm run test:tauri
