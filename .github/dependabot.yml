# Dependabot：依赖升级以可审查的 PR 形式到达。项目所有依赖版本均精确钉死
# （Cargo 用 =x.y.z，npm 用精确版本），因此每个 PR 都对应一次显式升级审查。
# 小版本与补丁合并为一个 PR，控制同时打开的 PR 数量。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    ignore:
      # tauri 2.11.6 的 test feature 有回归：其 src/test/mod.rs 构造
      # AppConfig 漏初始化 app_directories_override（E0063），本项目
      # dev-dependencies 启用 tauri/test，cargo test 直接编不过。修复
      # 落在 2.12.1，跳过 2.11.6；tauri 2.12 线升级（updater 2.13+ 要
      # 求 tauri ^2.12）单独评审后再放开。
      - dependency-name: "tauri"
        versions: [">=2.11.6, <2.12"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
