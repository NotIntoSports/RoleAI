# Dependabot：依赖升级以可审查的 PR 形式到达。项目所有依赖版本均精确钉死
# （Cargo 用 =x.y.z，npm 用精确版本），因此每个 PR 都对应一次显式升级审查。
# 小版本与补丁合并为一个 PR，控制同时打开的 PR 数量。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # tests/tauri/dependency-contract.test.mjs 硬编码钉死以下基础依赖，
      # 任何变动都会挂 verify。升级它们需同步改契约测试，属显式评审，
      # 不进 dependabot 组 PR——ignore 下限 = 契约锁定的当前版本+1。
      - dependency-name: "@tauri-apps/api"
        versions: [">=2.11.2"]
      - dependency-name: "@tauri-apps/cli"
        versions: [">=2.11.5"]
      - dependency-name: "react"
        versions: [">=19.2.9"]
      - dependency-name: "react-dom"
        versions: [">=19.2.9"]
      - dependency-name: "vite"
        versions: [">=8.2.3"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    ignore:
      # tauri 家族必须整体升级、单独评审，不进组 PR。实测任何局部
      # bump 都会坏 cargo test（tauri/test feature）：tauri 2.11.6 与
      # 2.11.5+tauri-utils 2.10.x（被 tauri-build 2.7.1 的 ~2.10.1 要
      # 求拖进）都在其 src/test/mod.rs 漏初始化 AppConfig 新字段
      # app_directories_override（E0063）；修复在 tauri 2.12.1。升级
      # 到 2.12 线需连动 tauri-build / 两个 plugin / @tauri-apps JS
      # 侧与契约测试，作为一次显式升级执行。ignore 下限 = 当前钉定
      # 版本 +1（patch 也会破坏契约）。
      # 注：逗号区间（">=2.11.6, <2.12"）在 cargo 生态不生效，一律
      # 用单约束开区间，升级评审后手动抬高下限。
      - dependency-name: "tauri"
        versions: [">=2.11.6"]
      - dependency-name: "tauri-build"
        versions: [">=2.6.4"]
      - dependency-name: "tauri-plugin-single-instance"
        versions: [">=2.4.5"]
      - dependency-name: "tauri-plugin-updater"
        versions: [">=2.11.1"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
